# Bygger tilläggets zip-fil och publicerar en GitHub-release när en versionstagg (v1.2.3) pushas.
# WordPress-sajterna hittar releasen via Plugin Update Checker och visar den som en uppdatering.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kontrollera att versionen i tillägget stämmer med taggen
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(grep -m1 -E '^\s*\*\s*Version:' hjuviks-design.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          echo "Tagg: $TAG  Tillägg: $VER"
          test "$TAG" = "$VER"

      - name: Bygg zip
        run: |
          mkdir -p build/hjuviks-design
          git archive HEAD | tar -x -C build/hjuviks-design
          cd build && zip -qr hjuviks-design.zip hjuviks-design

      - name: Publicera release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/hjuviks-design.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes "$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
